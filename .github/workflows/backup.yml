name: Scheduled D1 backup

# M-05: automates what scripts/backup.ps1 does manually today. Requires two repo secrets
# to actually run - CLOUDFLARE_API_TOKEN (a token with D1 read/export permission) and
# CLOUDFLARE_ACCOUNT_ID. Without them this job fails fast with a clear error instead of
# silently doing nothing; add the secrets in the repo's Settings -> Secrets and variables
# -> Actions before relying on this for real backups.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {} # allow a manual "Run workflow" for testing

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Check required secrets are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secrets are missing. Add them under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi
      - name: Export D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export site-creator-d1 --remote --output backup.sql
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup.sql
          retention-days: 90
